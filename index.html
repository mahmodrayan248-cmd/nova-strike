    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            image-rendering: auto;
        }
        #ui-layer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        #fire-btn {
            pointer-events: auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 60, 60, 0.35);
            border: 3px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background 0.1s;
            text-align: center;
            line-height: 1.2;
        }
        #fire-btn:active,
        #fire-btn.pressed {
            background: rgba(255, 60, 60, 0.75);
            border-color: #ff3c3c;
            box-shadow: 0 0 24px rgba(255, 60, 60, 0.7);
        }
        #pause-mini {
            pointer-events: auto;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        @media(min-width:768px) {
            #ui-layer {
                display: none;
            }
        }
        .splash-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s;
            pointer-events: all;
        }
        .splash-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: clamp(36px, 8vw, 72px);
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 40px #00d4ff, 0 0 80px #006080;
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                text-shadow: 0 0 30px #00d4ff, 0 0 60px #006080;
            }
            50% {
                text-shadow: 0 0 50px #00d4ff, 0 0 100px #00a0cc, 0 0 120px #004060;
            }
        }
        .splash-sub {
            color: #fff;
            font-size: 13px;
            margin-top: 8px;
            opacity: 0.7;
            letter-spacing: 3px;
        }
        .splash-tap {
            color: #ffd232;
            font-size: 12px;
            margin-top: 28px;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>

        function safePrevent(e) { if (e && e.cancelable) e.preventDefault(); }
        let audioCtx = null,
            SFX_VOL = 0.3;

        function initAudio() { if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
            if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playTone(freq, type, dur, vol = 1, gt = null) { if (!audioCtx || !SFX_VOL) return; try { const t = audioCtx
                    .currentTime,
                    o = audioCtx.createOscillator(),
                    g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, t); if (gt) o.frequency.linearRampToValueAtTime(gt, t + dur);
                g.gain.setValueAtTime(vol * SFX_VOL, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t);
                o.stop(t + dur); } catch {} }

        function playNoise(dur, vol = 1) { if (!audioCtx || !SFX_VOL) return; try { const t = audioCtx.currentTime,
                    buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate),
                    d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1); const s =
                    audioCtx.createBufferSource(),
                    g = audioCtx.createGain();
                s.buffer = buf;
                g.gain.setValueAtTime(vol * SFX_VOL * 0.6, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                s.connect(g);
                g.connect(audioCtx.destination);
                s.start(t); } catch {} }

        function sfxShoot() { playTone(800, 'square', 0.08, 0.5, 200);
            playTone(120, 'sine', 0.06, 0.3); }

        function sfxExplosion() { playNoise(0.25, 1.2);

        function t(k) { return (T[LANG] || T.en)[k] || T.en[k] || k; }

        function setLang(l) { LANG = l; try { localStorage.setItem('nv_lang2', l); } catch {} if (game) game.draw(); }
        let SET = { lang: 'ar', ctrl: 'touch', quality: 'high', sfxVol: 0.3, vibShoot: true, vibKill: true, vibUI: true,
            vibBoss: true, vibDamage: true };
        SFX_VOL = 0.3;

        function saveSet() { try { localStorage.setItem('nv_settings2', JSON.stringify(SET)); } catch {} }

        function vibEvent(type, ms) { if (!SET[type]) return; try { if (navigator.vibrate) navigator.vibrate(ms); } catch {} }
        const canvas = document.getElementById('c'),
            ctx = canvas.getContext('2d'),
            VW = 480,
            VH = 800;
        let scale = 1,
            offX = 0,
            offY = 0;

        function resize() { const sw = window.innerWidth,
                sh = window.innerHeight;
            scale = Math.min(sw / VW, sh / VH);
            const cw = Math.floor(VW * scale),
                ch = Math.floor(VH * scale);
            canvas.width = cw;
            canvas.height = ch;
            offX = (sw - cw) / 2;
            offY = (sh - ch) / 2;
            canvas.style.position = 'absolute';
            canvas.style.left = offX + 'px';
            canvas.style.top = offY + 'px';
            ctx.setTransform(scale, 0, 0, scale, 0, 0); }
        resize();
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 300));
        const lerp = (a, b, t) => a + (b - a) * t,
            clamp = (v, a, b) => Math.max(a, Math.min(b, v)),
            rand = (a, b) => Math.random() * (b - a) + a,
            rInt = (a, b) => Math.floor(rand(a, b + 1)),
            rPick = a => a[Math.floor(Math.random() * a.length)],
            PI2 = Math.PI * 2,
            overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        const C = { w: '#ffffff', cy: '#00d4ff', gold: '#ffd232', red: '#ff3c3c', gr: '#3cff80', or: '#ff8c1e',
            pur: '#b44fff', pk: '#ff50c8', yl: '#ffff32', bl: '#4080ff', pe: '#ff8c1e', blt: '#b4ff50' };
        const ECOLS = ['#ff507a', '#ffa028', '#7850ff', '#28dcaf', '#ffdc28', '#ff50c8', '#50c8ff', '#ff8050'];
        const SHIP_SKINS = [{ name: 'NOVA', body: '#50dcff', wing: '#3090d0', cockpit: '#8ff0ff', engine: '#ff8c1e',
                cost: 0 }, { name: 'PHANTOM', body: '#b44fff', wing: '#7030c0', cockpit: '#d8b0ff',
            engine: '#ff50c8', cost: 25 }, { name: 'INFERNO', body: '#ff3c3c', wing: '#c02020', cockpit: '#ff9999',
                engine: '#ffaa00', cost: 25 }, { name: 'EMERALD', body: '#3cff80', wing: '#20a050', cockpit: '#a0ffc0',
                engine: '#40ffc0', cost: 25 }, { name: 'GOLD', body: '#ffd232', wing: '#c09820', cockpit: '#ffe888',
                engine: '#ffaa00', cost: 30 }, { name: 'SHADOW', body: '#505060', wing: '#303040', cockpit: '#9090b0',
                engine: '#ff3c3c', cost: 35 }, { name: 'NEON', body: '#ff00ff', wing: '#aa00aa', cockpit: '#ffaaff',
                engine: '#00ffff', cost: 40 }, { name: 'CARBON', body: '#282830', wing: '#181820', cockpit: '#606070',
                engine: '#ff6600', cost: 35 }, { name: 'AURORA', body: '#00ffaa', wing: '#00aa70', cockpit: '#aaffdd',
                engine: '#ff80ff', cost: 45 }, { name: 'SOLAR', body: '#ffaa00', wing: '#cc7700', cockpit: '#ffdd88',
                engine: '#ffffff', cost: 50 }
        ];
        let shipSkin = 0,
            ownedSkins = [0];

        function saveSkins() { try { localStorage.setItem('nv_owned_skins2', JSON.stringify(ownedSkins)); } catch {} }

        function saveShipSkin() { try { localStorage.setItem('nv_skin2', String(shipSkin)); } catch {} }
        const PART_POOL_SIZE = 300;
        let partPool = [],
            partIdx = 0;

        function initPartPool() { partPool = Array.from({ length: PART_POOL_SIZE }, () => ({ x: 0, y: 0, col: '#fff',
                vx: 0, vy: 0, life: 0, ml: 0, size: 2, alive: false }));
            partIdx = 0; }
        initPartPool();

        function spawnPart(x, y, col, vx, vy, life, size) { const p = partPool[partIdx];
            p.x = x;
            p.y = y;
            p.col = col;
            p.vx = vx;
            p.vy = vy;
            p.life = life;
            p.ml = life;
            p.size = size;
            p.alive = true;
            partIdx = (partIdx + 1) % PART_POOL_SIZE; }

        function explode(x, y, col, n = 12, sp = 4) { for (let i = 0; i < Math.min(n, PART_POOL_SIZE); i++) { const a = rand(0,
                    PI2),
                    v = rand(0.5, sp) / 60;
                spawnPart(x, y, col, Math.cos(a) * v, Math.sin(a) * v, rand(15, 45), rInt(2, 5)); } }

        function trail(x, y, col) { for (let i = 0; i < 3; i++) spawnPart(x + rand(-8, 8), y + rand(0, 12), col, rand(-0.5,
                0.5) / 60, rand(1, 3) / 60, rand(8, 18), rInt(2, 4)); }

        function spawnFire(x, y) { for (let i = 0; i < 4; i++) { const a = rand(-Math.PI * 0.8, -Math.PI * 0.2),
                    v = rand(1, 3) / 60;
                spawnPart(x + rand(-8, 8), y + rand(-8, 8), rPick(['#ff6020', '#ff8800', '#ffaa00', '#ffff00']), Math.cos(
                    a) * v, Math.sin(a) * v, rand(10, 22), rInt(3, 6)); } }

        function spawnIce(x, y) { for (let i = 0; i < 3; i++) { const a = rand(0, PI2),
                    v = rand(0.3, 1) / 60;
                spawnPart(x + rand(-10, 10), y + rand(-10, 10), rPick(['#aaeeff', '#80d0ff', '#ffffff', '#c0f0ff']), Math
                    .cos(a) * v, Math.sin(a) * v, rand(12, 25), rInt(2, 4)); } }

        function explodeMeteor(x, y, r) { const rockCols = ['#8a7260', '#6b5642', '#5a4636', '#3d2c1c', '#2e2116'];
            const fireCols = ['#ff6a00', '#ffb238', '#ffdc50'];
            const n = Math.min(30, Math.max(14, Math.floor(r * 1.4)));
            for (let i = 0; i < n; i++) { const a = rand(0, PI2),
                    v = rand(1, 5.5) / 60;
                spawnPart(x, y, rPick(rockCols), Math.cos(a) * v, Math.sin(a) * v, rand(25, 55), rInt(3, 7)); }
            for (let i = 0; i < 12; i++) { const a = rand(0, PI2),
                    v = rand(0.5, 3.2) / 60;
                spawnPart(x, y, rPick(fireCols), Math.cos(a) * v, Math.sin(a) * v, rand(15, 32), rInt(2, 5)); } }

        function updateParts(dt) { const f = dt * 60; for (const p of partPool) { if (!p.alive) continue;
                p.x += p.vx * f;
                p.y += p.vy * f;
                p.vy += 0.05 * f;
                p.vx *= Math.pow(0.97, f);
                p.life -= f; if (p.life <= 0) p.alive = false; } }

        function drawParts() { const skip = SET.quality === 'low' ? 2 : 1; for (let i = 0; i < partPool.length; i += skip) { const
                    p = partPool[i]; if (!p.alive) continue;
                const a = Math.max(0, p.life / p.ml);
                ctx.globalAlpha = a;
                ctx.fillStyle = p.col;
                ctx.beginPath();
                ctx.arc(~~p.x, ~~p.y, Math.max(1, p.size * a), 0, PI2);
                ctx.fill(); }
            ctx.globalAlpha = 1; }
        class Starfield { constructor() { const cnt = SET.quality === 'low' ? 80 : 180;
                this.stars = Array.from({ length: cnt }, () => ({ x: rand(0, VW), y: rand(0, VH), sp: rand(0.4, 2.8),
                    r: rPick([1, 1, 1, 2, 2, 3]), col: rPick(['#c8c8ff', '#ffc8c8', '#c8ffc8', '#ffffc8',
                        '#c8dcff', '#ffffff', '#aaccff'
                    ]), tw: rand(0, PI2), twSp: rand(0.01, 0.04) })); } update(dt) { for (const s of this.stars) { s.y +=
                        s.sp * dt * 60;
                    s.tw += s.twSp * dt * 60; if (s.y > VH + 5) { s.y = -5;
                        s.x = rand(0, VW); } } } draw() { for (const s of this.stars) { const a = SET.quality === 'high' ? (0.5 +
                        0.4 * Math.sin(s.tw)) : 0.65;
                    ctx.globalAlpha = a;
                    ctx.fillStyle = s.col; if (s.r <= 1) ctx.fillRect(~~s.x, ~~s.y, 1, 1); else { ctx.beginPath();
                        ctx.arc(~~s.x, ~~s.y, s.r, 0, PI2);
                        ctx.fill(); } }
                ctx.globalAlpha = 1; } }

        class AmbientFX {
            constructor() {
                this.lightning = { phase: 'idle', timer: rand(7, 12), warnT: 0, flashT: 0, x: 0 };
                this.meteor = { timer: rand(9, 14), list: [] };
                this.wind = { active: false, timer: rand(9, 15), durLeft: 0, particles: [] };
            }
            update(dt) {
                const L = this.lightning;
                if (L.phase === 'idle') {
                    L.timer -= dt;
                    if (L.timer <= 0) { L.phase = 'warn'; L.warnT = 0.8; L.x = rand(VW * 0.15, VW * 0.85); }
                } else if (L.phase === 'warn') {
                    L.warnT -= dt;
                    if (L.warnT <= 0) { L.phase = 'strike'; L.flashT = 0.16; sfxThunder(); }
                } else if (L.phase === 'strike') {
                    L.flashT -= dt;
                    if (L.flashT <= 0) { L.phase = 'idle'; L.timer = rand(10, 18); }
                }
                const M = this.meteor;
                if (M.list.length === 0) {
                    M.timer -= dt;
                    if (M.timer <= 0) {
                        const n = rInt(4, 6);
                        const lane = (VW - 80) / n;
                        for (let i = 0; i < n; i++) {
                            M.list.push({
                                x: 40 + lane * i + rand(6, lane - 6), y: -60 - rand(0, 260),

        const splashEl = document.getElementById('splash');
